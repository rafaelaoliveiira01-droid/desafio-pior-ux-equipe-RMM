<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Fácil™</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>CADASTRO SUPER SIMPLES</h1>

        <p class="aviso">
            É muito fácil! Só siga as instruções.
        </p>

        <form id="formulario">

            <label>Nome completo:</label>
            <input type="text" id="nome">

            <label>E-mail:</label>
            <input type="email" id="email">

            <label>Senha:</label>
            <input type="password" id="senha">

            <label>Confirme sua senha:</label>
            <input type="password" id="confirmar">

            <div class="botoes">
                <button type="button" class="cancelar" onclick="cancelar()">
                    AVANÇAR
                </button>

                <button type="submit" class="avancar">
                    CANCELAR
                </button>
            </div>

            <p id="mensagem"></p>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
